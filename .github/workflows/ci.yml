name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Protocol check (JVM)
        working-directory: protocol-check
        run: ./gradlew run --no-daemon

      - name: Upload protocol transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-transcript
          path: protocol-check/build/protocol-transcript.txt
          if-no-files-found: ignore

      - name: Prebuild Android project
        run: npx expo prebuild -p android --no-install

      # A release build carries its JS bundle, so it runs without a Metro dev server.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: attend-tag-emulator-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
